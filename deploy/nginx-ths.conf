# Nginx: host client tĩnh + proxy WebSocket (WSS) trên cùng 1 domain
# Đặt file này vào /etc/nginx/sites-available/ths rồi symlink sang sites-enabled.
# Sau đó: certbot --nginx -d game.example.com   (để có https/wss)

server {
    listen 80;
    server_name game.example.com;

    # Client tĩnh (copy thư mục client/ và shared/ lên /var/www/ths)
    root /var/www/ths;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    # Thư mục shared nằm ngang hàng client -> alias
    location /shared/ {
        alias /var/www/ths-shared/;
    }

    # WebSocket server -> wss://game.example.com/ws
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
# LƯU Ý: khi dùng /ws/, client phải nối wss://game.example.com/ws
#  -> mở client bằng: https://game.example.com/?server=wss://game.example.com/ws
