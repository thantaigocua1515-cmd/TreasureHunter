<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Treasure Hunter Survival</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="status" class="off">● OFFLINE DEMO</div>
    <div class="bars">
      <div class="bar"><div id="bar-hp" class="fill hp"></div><span>HP</span></div>
      <div class="bar"><div id="bar-st" class="fill st"></div><span>TL</span></div>
      <div class="bar"><div id="bar-hu" class="fill hu"></div><span>ĐÓI</span></div>
    </div>
    <div id="inv">🪵0 🪨0 🌿0 🍖0 🪙0</div>
    <button id="btn-mute" title="Bật/tắt nhạc">🔊</button>
  </div>

  <audio id="bgm" loop preload="auto"></audio>

  <!-- feed sự kiện (loot, boss...) -->
  <div id="feed"></div>

  <!-- chat -->
  <div id="chat">
    <div id="chat-log"></div>
    <input id="chat-input" placeholder="Chat thế giới... (Enter để gửi)" maxlength="120">
  </div>

  <!-- joystick ảo (nửa trái màn hình) -->
  <div id="joy-zone"></div>
  <div id="joy-base"><div id="joy-knob"></div></div>

  <!-- nút bấm (nửa phải) -->
  <div id="btns">
    <button id="btn-use" title="Tương tác (E)">✋</button>
    <button id="btn-atk" title="Tấn công (Space)">⚔️</button>
  </div>

  <div id="hint">WASD di chuyển · Space đánh · E thu hoạch · Shift chạy nhanh</div>
</div>

<script src="../shared/protocol.js"></script>
<script src="js/sprites.js"></script>
<script src="js/sunny-data.js"></script>
<script src="js/sunny.js"></script>
<script src="js/input.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
